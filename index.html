<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glass Pulse — iOS Fix (Cejas + Boca, WAV/MP3)</title>
  <style>
    :root { --bg:#0b0b0c; --fg:#e7e7ea; }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu;}
    .wrap{display:grid;place-items:center;min-height:100vh;padding:16px;gap:12px}
    .stage{position:relative;width:min(92vw,540px);aspect-ratio:9/16;border-radius:20px;
      overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,.45);background:#000}
    video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
    canvas{position:absolute;inset:0;width:100%;height:100%}
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:rgba(0,0,0,.6);z-index:9;cursor:pointer}
    .cta{background:#ffffff10;border:1px solid #ffffff30;color:#fff;padding:14px 18px;
      border-radius:14px;font-size:16px;backdrop-filter: blur(6px);text-align:center}
    .badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .pill{font-size:12px;opacity:.85;border:1px solid #29292e;padding:6px 10px;
      border-radius:999px;background:#17171a}
    .dot{display:inline-block;width:8px;height:8px;border-radius:999px;background:#888;margin-right:6px}
    .dot.on{background:#6ee7ff}
    .log{max-width:540px;width:100%;background:#111;border:1px solid #2b2b31;border-radius:12px;
      padding:10px;font-size:12px;line-height:1.35;white-space:pre-wrap}
    .ok{color:#9BEF8A} .warn{color:#FFD166} .err{color:#FF6B6B}
  </style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">
    <video id="cam" playsinline muted></video>
    <canvas id="fx"></canvas>
    <div class="overlay" id="ovl"><div class="cta">Toca aquí para iniciar cámara + audio</div></div>
  </div>
  <div class="badges">
    <span class="pill"><span class="dot" id="browDot"></span>Cejas arriba ▸ B</span>
    <span class="pill"><span class="dot" id="mouthDot"></span>Boca abierta ▸ A</span>
  </div>
  <div class="log" id="log"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>
<script>
const logEl = document.getElementById('log');
function log(m,c=''){const d=document.createElement('div');d.className=c;d.textContent=m;
logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;}

// ====== Config general ======
const AUDIO_CANDIDATES = [
  { A:'assets/glass_A_vocal_loop.wav', B:'assets/glass_B_beat_loop.wav' },
  { A:'assets/glass_A_vocal_loop.mp3', B:'assets/glass_B_beat_loop.mp3' }
];

let actx, gainA, gainB, bufA, bufB;
let started = false; // evita dobles inicios (touch+click)

// ====== WebAudio helpers ======
function ensureCtx(){ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } return actx; }
function playSilentClick(){ // click inaudible para desbloquear iOS
  const ctx = ensureCtx();
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  g.gain.value = 0.0001;
  o.connect(g).connect(ctx.destination);
  o.start(0); o.stop(ctx.currentTime + 0.05);
}
async function loadBuffer(url){
  const res = await fetch(url,{cache:"no-store"});
  if(!res.ok) throw new Error(`No se pudo cargar ${url}`);
  const arr = await res.arrayBuffer();
  try { return await ensureCtx().decodeAudioData(arr); }
  catch(e){ throw new Error(`Decoding failed: ${url}`); }
}
function playLoop(buffer){
  const ctx = ensureCtx();
  const src = ctx.createBufferSource();
  src.buffer = buffer; src.loop = true;
  const g = ctx.createGain(); g.gain.value = 0.0;
  src.connect(g).connect(ctx.destination); src.start(0);
  return g;
}
function ramp(g,to,time=0.12){
  const ctx=ensureCtx(); const now=ctx.currentTime;
  g.gain.cancelScheduledValues(now);
  g.gain.setValueAtTime(g.gain.value, now);
  g.gain.linearRampToValueAtTime(to, now+time);
}
async function unlockAudio(){
  ensureCtx();
  playSilentClick();
  try { await actx.resume(); } catch {}
  log('AudioContext: ' + actx.state, actx.state==='running'?'ok':'warn');
  return actx.state === 'running';
}

// ====== App principal ======
(async function(){
  const video = document.getElementById('cam');
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  const ovl = document.getElementById('ovl');
  const browDot = document.getElementById('browDot');
  const mouthDot = document.getElementById('mouthDot');

  const lerp=(a,b,t)=>a+(b-a)*t;
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const NOSE_BASE=1,CHIN=152,MOUTH_TOP=13,MOUTH_BOTTOM=14;

  let browsUp=false,mouthOpen=false,browsEMA=0,mouthEMA=0;
  let browBase=0,browFrames=0,browCalibrated=false;

  function drawGlass(lm){
    const w=canvas.width=video.videoWidth||540;
    const h=canvas.height=video.videoHeight||960;
    const g=ctx.createRadialGradient(w*0.5,h*0.35,10,w*0.5,h*0.55,Math.max(w,h)*0.8);
    g.addColorStop(0,'rgba(255,255,255,0.03)');
    g.addColorStop(1,'rgba(0,0,0,0.35)');
    ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  }

  async function start(e){
    if (started) return; // anti-doble
    started = true;

    try{
      ovl.style.display='none';

      // 1) Desbloqueo iOS
      const unlocked = await unlockAudio();
      if(!unlocked){ throw new Error('AudioContext bloqueado'); }

      // 2) Carga de audio con fallback WAV→MP3
      log('Cargando audio A/B…','warn');
      let loaded = false;
      for (const cand of AUDIO_CANDIDATES) {
        try {
          [bufA, bufB] = await Promise.all([loadBuffer(cand.A), loadBuffer(cand.B)]);
          log(`Audio cargado (${cand.A.endsWith('.wav')?'WAV':'MP3'}) ✅`,'ok');
          loaded = true; break;
        } catch(err){ log(err.message,'err'); }
      }
      if(!loaded) throw new Error('Error al cargar audios');

      // Inicializa loops en silencio
      gainA = playLoop(bufA);
      gainB = playLoop(bufB);

      // (Opcional) Ping de verificación:
      // ramp(gainA, 0.35, 0.05); setTimeout(()=>ramp(gainA, 0.0, 0.2), 400);

      // 3) Cámara
      log('Pidiendo permiso de cámara…','warn');
      const s = await navigator.mediaDevices.getUserMedia({
        video:{facingMode:'user', width:{ideal:720}, height:{ideal:1280}}, audio:false
      });
      video.srcObject=s; await video.play(); log('Cámara OK ✅','ok');

      // 4) FaceMesh
      const faceMesh=new FaceMesh({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/${f}`});
      faceMesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:0.6,minTrackingConfidence:0.6});

      faceMesh.onResults((res)=>{
        if(!res||!res.multiFaceLandmarks||!res.multiFaceLandmarks.length)return;
        const lm=res.multiFaceLandmarks[0];
        const scale=dist(lm[NOSE_BASE],lm[CHIN]);

        // --- CEJAS (calibración + histéresis) ---
        const browY = (lm[10].y + lm[67].y + lm[297].y)/3;
        const eyeY  = (lm[159].y + lm[386].y)/2;
        const browLift = (eyeY - browY) / scale;  // ↑ cejas => mayor
        browsEMA = lerp(browsEMA, browLift, 0.25);

        if(!browCalibrated){
          browBase += browsEMA; browFrames++;
          if(browFrames>70){ browBase/=browFrames; browCalibrated=true; log('Cejas calibradas ✅','ok'); }
        }

        const liftDelta = browsEMA - browBase;
        const raiseThreshold = 0.10; // más alto = más exigente (0.12–0.15)
        const lowerThreshold = 0.06; // liberar
        let browsUpNow = browsUp;
        if (!browsUp && liftDelta > raiseThreshold) browsUpNow = true;
        if (browsUp && liftDelta < lowerThreshold) browsUpNow = false;

        // --- BOCA ---
        const mouthDist = dist(lm[MOUTH_TOP], lm[MOUTH_BOTTOM]);
        const mouthMetric = mouthDist/scale;
        mouthEMA = lerp(mouthEMA, mouthMetric, 0.35);
        const mouthOpenNow = mouthEMA > 0.30;

        // 👄 Abrir boca → A
        if (mouthOpenNow && !mouthOpen) ramp(gainA,0.9);
        if (!mouthOpenNow && mouthOpen) ramp(gainA,0.0);
        mouthOpen = mouthOpenNow;

        // 👆 Subir cejas → B
        if (browsUpNow && !browsUp) ramp(gainB,0.95);
        if (!browsUpNow && browsUp) ramp(gainB,0.0);
        browsUp = browsUpNow;

        browDot.classList.toggle('on',browsUp);
        mouthDot.classList.toggle('on',mouthOpen);
        drawGlass(lm);
      });

      new Camera(video,{onFrame:async()=>{await faceMesh.send({image:video});}}).start();
      log('AR + audio listos ✅','ok');
    }catch(e){
      log('Error: '+(e?.message||e),'err');
      ovl.style.display='flex';
      ovl.querySelector('.cta').textContent='Pulsa aquí de nuevo. Si sigue, revisa permisos y formato de audio.';
      started = false; // permite reintentar si falló
    }
  }

  // Listener único para evitar doble inicio (touch + click)
  document.getElementById('stage').addEventListener('pointerdown', start, { once:true });

  log('Tip: quita el Modo Silencio del iPhone y sube volumen 🔊','warn');
})();
</script>
</body>
</html>
